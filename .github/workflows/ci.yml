name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_VERSION: 0.12.0
  UV_NO_SYNC: 1
  UV_LOCKED: 1
  PY_COLORS: 1

permissions:
  contents: read
jobs:
  app:
    if: github.repository == 'ghostty-org/discord-bot'
    runs-on: namespace-profile-ghostty-sm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Environment
        id: sync
        run: uv sync

      - name: taplo (TOML formatting)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run taplo fmt --check --diff pyproject.toml packages/*/pyproject.toml config-example.toml
      - name: ruff format (Python formatting)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run ruff format --diff
      - name: mdformat (Markdown formatting)
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run mdformat --number --wrap 80 --check *.md
      - name: ruff lint
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run ruff check --output-format github
      - name: basedpyright
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          # See https://github.com/microsoft/pyright/discussions/11540 for details on this workaround
          uv run python -c 'import githubkit_schemas; from pathlib import Path; Path(next(iter(githubkit_schemas.__path__)), "__init__.py").touch()'
          uv run basedpyright app tests
      - name: pytest
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run pytest -vv tests

  toolbox:
    if: github.repository == 'ghostty-org/discord-bot'
    runs-on: namespace-profile-ghostty-sm
    defaults:
      run:
        working-directory: ./packages/toolbox
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Environment
        id: sync
        run: uv sync

      - name: basedpyright
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: |
          # See https://github.com/microsoft/pyright/discussions/11540 for details on this workaround
          uv run python -c 'import githubkit_schemas; from pathlib import Path; Path(next(iter(githubkit_schemas.__path__)), "__init__.py").touch()'
          uv run basedpyright src tests
      - name: pytest
        if: ${{ !cancelled() && steps.sync.conclusion == 'success' }}
        run: uv run pytest -vv tests

  zizmor:
    name: Run zizmor
    if: github.repository == 'ghostty-org/discord-bot'
    runs-on: namespace-profile-ghostty-sm
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
